spring:
  application:
    name: rydzo-api-gateway

  cloud:
    gateway:
      # Route definitions for all microservices
      routes:
        # User Service Routes
        - id: user-service
          uri: lb://rydzo-user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users/(?<path>.*), /users/$\{path}

        # Vendor Service Routes
        - id: vendor-service
          uri: lb://rydzo-vendor-service
          predicates:
            - Path=/api/v1/vendors/**
          filters:
            - RewritePath=/api/v1/vendors/(?<path>.*), /vendors/$\{path}

        # Vehicle Service Routes
        - id: vehicle-service
          uri: lb://rydzo-vehicle-service
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - RewritePath=/api/v1/vehicles/(?<path>.*), /vehicles/$\{path}

        # Local Carpool Service Routes
        - id: local-carpool-service
          uri: lb://rydzo-local-carpool-service
          predicates:
            - Path=/api/v1/local-rides/**
          filters:
            - RewritePath=/api/v1/local-rides/(?<path>.*), /local-rides/$\{path}

        # Intercity Pool Service Routes
        - id: intercity-pool-service
          uri: lb://rydzo-intercity-pool-service
          predicates:
            - Path=/api/v1/intercity-rides/**
          filters:
            - RewritePath=/api/v1/intercity-rides/(?<path>.*), /intercity-rides/$\{path}

        # Booking Service Routes
        - id: booking-service
          uri: lb://rydzo-booking-service
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - RewritePath=/api/v1/bookings/(?<path>.*), /bookings/$\{path}

        # Payment Service Routes
        - id: payment-service
          uri: lb://rydzo-payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - RewritePath=/api/v1/payments/(?<path>.*), /payments/$\{path}

        # Notification Service Routes
        - id: notification-service
          uri: lb://rydzo-notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RewritePath=/api/v1/notifications/(?<path>.*), /notifications/$\{path}

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.rydzo.gatewy: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
